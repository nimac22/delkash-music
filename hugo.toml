baseURL = "https://delkash-music.ir/"
languageCode = "fa-ir"
defaultContentLanguage = "fa"
title = "موسیقی دلکش | مرجع متن آهنگ و تصنیف ایرانی"
theme = "PaperMod"

[languages.fa]
  languageName = "فارسی"
  languageDirection = "rtl"
  weight = 1

[pagination]
  pagerSize = 10
[taxonomies]
  category = "categories"
  tag = "tags"
  artist = "artists"
  composer = "composers"
  decade = "decades"

[params]
  description = "مرجع متن آهنگ و تصنیف‌های ماندگار موسیقی ایرانی — پخش آنلاین و دانلود با کیفیت بالا"
  author = "تیم موسیقی دلکش"
  defaultTheme = "dark"
  images = ["images/background.jpg"]
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = false
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false

[params.header]
  label = "موسیقی دلکش"

[params.homeInfoParams]
  Title = "🎵 به موسیقی دلکش خوش آمدید"
  Content = "مرجع متن آهنگ و تصنیف‌های ماندگار موسیقی ایرانی — با دسته‌بندی دستگاه‌ها و پخش آنلاین"

[[params.socialIcons]]
  name = "telegram"
  url = "https://t.me/delkash_music"

[[params.socialIcons]]
  name = "rss"
  url = "index.xml"

[[menu.main]]
  identifier = "home"
  name = "صفحه نخست"
  url = "/"
  weight = 1

[[menu.main]]
  identifier = "posts"
  name = "همه آهنگ‌ها"
  url = "/posts/"
  weight = 2

[[menu.main]]
  identifier = "tags"
  name = "دستگاه‌های موسیقی"
  url = "/tags/"
  weight = 3

[[menu.main]]
  identifier = "about"
  name = "درباره ما"
  url = "/about/"
  weight = 4

[params.assets]
  customCSS = ["css/custom.css"]

[sitemap]
  changefreq = "weekly"
  priority = 0.5

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup.goldmark.renderer]
  unsafe = true
  hardWraps = true
