{{- /* logo.svg */ -}}
{{- $label := string .Site.Title -}}
{{- if isset .Site.Params "header" -}}
  {{- $label = .Site.Params.header.label -}}
{{- end -}}

<header class="site-header" style="
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(21,16,9,.86);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid #3d301c;
">
  <div class="header-inner" style="
    max-width: 1150px;
    margin: 0 auto;
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  ">
    <!-- برند -->
    <div class="brand" style="display: flex; align-items: center; gap: 14px;">
      <span class="brand-mark" aria-hidden="true" style="
        width: 52px;
        height: 52px;
        display: grid;
        place-items: center;
        font-size: 26px;
        color: #241a08;
        background: linear-gradient(145deg, #f3d28f, #e0aa4e);
        border-radius: 14px;
        box-shadow: 0 6px 18px rgba(224,170,78,.35);
      ">♪</span>
      <div>
        <div class="brand-title" style="
          font-family: 'Lalezar', sans-serif;
          font-size: 1.65rem;
          line-height: 1.3;
          margin: 0;
        ">
          <a href="{{ "" | absLangURL }}" style="color: #f3d28f; text-decoration: none;">
            {{ $label }}
          </a>
        </div>
        <p class="brand-desc" style="
          color: #b6a486;
          font-size: 0.8rem;
          line-height: 1.6;
          margin: 0;
        ">
          {{ .Site.Params.description }}
        </p>
      </div>
    </div>

    <!-- منوی ناوبری -->
    <nav aria-label="منوی اصلی">
      <ul class="main-nav" style="
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        list-style: none;
        padding: 0;
        margin: 0;
      ">
        {{- $currentPage := . -}}
        {{- range .Site.Menus.main -}}
        <li>
          <a href="{{ .URL }}" style="
            color: #f6eddd;
            text-decoration: none;
            font-size: 0.88rem;
            padding: 8px 14px;
            border-radius: 99px;
            border: 1px solid transparent;
            display: block;
          ">{{ .Name }}</a>
        </li>
        {{- end }}
      </ul>
    </nav>
  </div>

  <!-- جداکننده تزئینی -->
  <div class="delkash-divider" style="
    display: flex;
    align-items: center;
    gap: 14px;
    color: #e0aa4e;
    opacity: 0.6;
    margin: 0 auto;
    max-width: 1150px;
    padding: 0 20px 10px;
    font-size: 1rem;
  ">
    <span>♩</span><span>♪</span><span>♫</span>
  </div>
</header>
